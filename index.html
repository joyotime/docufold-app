<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuFold - Upgrade to Pro</title>
  
  <!-- 1. 引入 Tailwind CSS (样式库) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. 引入 Lemon Squeezy JS SDK (支付弹窗核心库) -->
  <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex items-center justify-center p-6">

  <!-- 价格卡片容器 -->
  <div class="max-w-sm w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden p-8 text-center transition-all hover:shadow-2xl">
    
    <span class="inline-block px-3 py-1 text-xs font-semibold uppercase tracking-wider text-amber-700 bg-amber-50 rounded-full mb-4">
      Lifetime / 终身版
    </span>
    
    <h3 class="text-2xl font-bold text-slate-900 mb-2">DocuFold Pro</h3>
    <p class="text-slate-500 text-sm mb-6">一次付费，解锁全部高级文档处理功能。</p>

    <div class="flex justify-center items-baseline my-6">
      <span class="text-5xl font-extrabold text-slate-900">$29</span>
      <span class="text-slate-400 font-medium ml-1">/ 买断</span>
    </div>

    <!-- 功能列表 -->
    <ul class="text-left text-sm text-slate-600 space-y-3 mb-8 border-t border-b border-slate-100 py-6">
      <li class="flex items-center">
        <svg class="w-5 h-5 text-emerald-500 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        无限量文档处理
      </li>
      <li class="flex items-center">
        <svg class="w-5 h-5 text-emerald-500 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        高级导出格式选项
      </li>
      <li class="flex items-center">
        <svg class="w-5 h-5 text-emerald-500 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        优先技术支持
      </li>
    </ul>

    <!-- 支付按钮：请将 href 中的 YOUR_CHECKOUT_URL_HERE 替换为你的真实链接 -->
    <!-- 注意：链接末尾必须保留 ?embed=1 才能触发 Overlay 弹窗 -->
    <a 
      id="checkout-btn"
      href="https://docufold.lemonsqueezy.com/checkout/buy/6e97edf7-08a7-4496-8656-bcc6dec2f699" 
      class="lemonsqueezy-button inline-block w-full py-3.5 px-6 rounded-xl font-medium text-white bg-amber-500 hover:bg-amber-600 active:scale-[0.98] transition-all duration-150 shadow-md hover:shadow-lg shadow-amber-500/20 text-center cursor-pointer"
    >
      立即升级
    </a>

  </div>

  <!-- 3. JS 事件监听逻辑 -->
  <script>
    window.createLemonSqueezy = window.createLemonSqueezy || function() { (window.createLemonSqueezy.q = window.createLemonSqueezy.q || []).push(arguments) };

    document.addEventListener('DOMContentLoaded', () => {
      // 初始化 Lemon Squeezy SDK
      window.createLemonSqueezy({
        eventHandler: (event) => {
          console.log('Lemon Squeezy Event:', event.event, event);

          // 监听用户付款成功事件
          if (event.event === 'Checkout.Success') {
            alert('恭喜，支付成功！已解锁 DocuFold Pro 权限。');
            // 此处可添加成功后的跳转，例如:
            // window.location.href = '/dashboard.html';
          }

          // 监听弹窗关闭事件
          if (event.event === 'Checkout.Closed') {
            console.log('用户关闭了支付弹窗');
          }
        }
      });
    });
  </script>

</body>
</html>
