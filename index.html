<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"

    />

    <!-- Lemon Squeezy 支付 Overlay SDK -->

    <div id="root"></div>
    <div style="position: fixed; top: 16px; right: 20px; z-index: 9999;">
  <a 
    href="https://docufold.lemonsqueezy.com/checkout/buy/6e97edf7-08a7-4496-8656-bcc6dec2f699" 
    class="lemonsqueezy-button"
    style="background-color: #f59e0b; color: white; padding: 8px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 14px;"

    <!-- 注意：这里指向 Vite 的源码入口文件，Vite 打包时会自动将它转化为 assets/xxx.js -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Lemon Squeezy 前端事件监听逻辑 -->
    <script>
      window.createLemonSqueezy = window.createLemonSqueezy || function() { (window.createLemonSqueezy.q = window.createLemonSqueezy.q || []).push(arguments) };

      document.addEventListener('DOMContentLoaded', () => {
        window.createLemonSqueezy({
          eventHandler: (event) => {
            console.log('Lemon Squeezy Event:', event.event, event);

            if (event.event === 'Checkout.Success') {
              alert('恭喜，支付成功！已解锁 DocuFold Pro 权限。');
            }
          }
        });
      });
    </script>
  </body>
